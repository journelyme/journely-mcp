name: Publish to MCP Registry

# Publishes server.json to registry.modelcontextprotocol.io via GitHub OIDC.
# OIDC proves this repo's identity, so publishing under io.github.journelyme/*
# works without relying on a personal account's org membership (the
# interactive `login github` flow 403s on org namespaces — see
# modelcontextprotocol/registry#1537).
#
# Runs on manual dispatch, and on main whenever server.json changes.
# Bump "version" in server.json for each publish — the registry rejects
# re-publishing an existing version.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [server.json]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
